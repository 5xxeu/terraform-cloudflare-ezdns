name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance of the archives: a Sigstore certificate (id-token) and the
  # attestation stored in the repository
  id-token: write
  attestations: write
  artifact-metadata: write
  # The CI result of the tagged commit
  checks: read
  # The end-to-end runs of the tagged commit
  actions: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag is released only from a commit that passed CI. The latest run counts, so a
      # re-run after a flaky failure is enough (latest by id: a queued run has no
      # started_at yet). The tag usually follows the merge right away, while CI on main
      # still runs, so this waits for it
      - name: Wait for CI of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20passed&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length == 0 then "missing" else (sort_by(.id) | last | if .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failure" end) end') ||
              conclusion="unavailable (API error)"
            case "$conclusion" in
              success) echo "CI passed for ${GITHUB_SHA}"; exit 0 ;;
              failure) echo "CI failed for ${GITHUB_SHA}"; exit 1 ;;
            esac
            echo "CI for ${GITHUB_SHA}: ${conclusion}, waiting (${attempt}/60)"
            sleep 30
          done
          echo "No CI result for ${GITHUB_SHA} after 30 minutes"; exit 1

      # The end-to-end test (a real zone, run by hand or weekly) must have passed on the
      # tagged commit too: gh workflow run End-to-end --ref main after the merge, then
      # the tag. The latest run counts; a run still going is waited for (it times out
      # after 30 minutes)
      - name: Require the end-to-end test of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 70); do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '.workflow_runs | if length == 0 then "missing" else (sort_by(.id) | last | if .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failure" end) end') ||
              conclusion="unavailable (API error)"
            case "$conclusion" in
              success) echo "End-to-end test passed for ${GITHUB_SHA}"; exit 0 ;;
              failure) echo "End-to-end test failed for ${GITHUB_SHA}"; exit 1 ;;
              missing) echo "No end-to-end run for ${GITHUB_SHA}: run gh workflow run End-to-end --ref main, then re-run this workflow"; exit 1 ;;
            esac
            echo "End-to-end test for ${GITHUB_SHA}: ${conclusion}, waiting (${attempt}/70)"
            sleep 30
          done
          echo "No end-to-end result for ${GITHUB_SHA} after 35 minutes"; exit 1

      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          test -s notes.md || { echo "No CHANGELOG entry for ${GITHUB_REF_NAME}"; exit 1; }

      # The module files only, for a local copy in the configurations that use it:
      # the full module, and a provider v5 one without the v4 wrapper and its
      # migration moved block
      - name: Module archives
        run: |
          full="terraform-cloudflare-ezdns-${GITHUB_REF_NAME}.tar.gz"
          v5="terraform-cloudflare-ezdns-v5-${GITHUB_REF_NAME}.tar.gz"
          mkdir -p dist/module dist/module-v5
          git archive HEAD -- ':(glob)*.tf' modules schema tools docs README.md CHANGELOG.md LICENSE \
            ':(exclude,glob)modules/**/tests/**' ':(exclude)tools/tests' | tar -x -C dist/module
          git archive HEAD -- ':(glob)*.tf' modules/dns/v5 modules/dns/records schema docs README.md CHANGELOG.md LICENSE \
            ':(exclude,glob)modules/**/tests/**' ':(exclude)modules/dns/v5/migrate-from-v4.tf' | tar -x -C dist/module-v5
          echo "$GITHUB_REF_NAME" >dist/module/VERSION
          echo "$GITHUB_REF_NAME" >dist/module-v5/VERSION
          tar -czf "dist/${full}" -C dist/module .
          tar -czf "dist/${v5}" -C dist/module-v5 .
          (cd dist && sha256sum "${full}" "${v5}" >SHA256SUMS)

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Before anything is published: the files a configuration needs, no tests, no v4
      # wrapper in the v5 archive, and both archives validate as modules
      - name: Check the archives
        run: ./scripts/check-archives.sh "dist/terraform-cloudflare-ezdns-${GITHUB_REF_NAME}.tar.gz" "dist/terraform-cloudflare-ezdns-v5-${GITHUB_REF_NAME}.tar.gz"

      # Signed SLSA build provenance of the archives, checked with
      # gh attestation verify <archive> --repo 5xxeu/terraform-cloudflare-ezdns \
      #   --signer-workflow 5xxeu/terraform-cloudflare-ezdns/.github/workflows/release.yml
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest \
            "dist/terraform-cloudflare-ezdns-${GITHUB_REF_NAME}.tar.gz" \
            "dist/terraform-cloudflare-ezdns-v5-${GITHUB_REF_NAME}.tar.gz" dist/SHA256SUMS
